name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  public-history-secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch every public branch and tag ref
        run: git fetch --force --prune origin '+refs/heads/*:refs/remotes/origin/*' '+refs/tags/*:refs/tags/*'
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
      - name: Scan every reachable Git blob for credential exposure
        run: node scripts/scan-public-history-secrets.js

  reference-conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
      - name: Tests
        run: node --test
      - name: Repository validation
        run: node scripts/validate-repository.js
      - name: Execute public source-level examples
        run: npm run examples:check
      - name: Reference evidence
        run: node src/cli.js demo --subject reference --out artifacts/reference
      - name: Known-bad counterexamples
        run: node src/cli.js demo --subject known-bad --out artifacts/known-bad
      - name: Verify report inspection example
        run: |
          node examples/inspect-report.mjs artifacts/reference/report.json
          node examples/inspect-report.mjs artifacts/known-bad/report.json
      - name: Upload conformance evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: actionseam-reference-evidence
          path: artifacts/
          if-no-files-found: error

  invokta-action-target:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: adapters/invokta
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
      - name: Install exact adapter dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify real Invokta boundary
        run: npm test
      - name: Generate Invokta matrix evidence
        run: npm run evidence
      - name: Upload Invokta evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: actionseam-invokta-evidence
          path: adapters/invokta/artifacts/
          if-no-files-found: error

  deepseek-harness-public-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: adapters/deepseek-harness
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
      - name: Install frozen DSH profile dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify public bootstrap surfaces
        run: npm run verify
      - name: Emit public bootstrap probe
        run: |
          node probe.js > probe-output.json
          cat probe-output.json
      - name: Exercise real DSH AgentLoop tool round trip
        run: |
          node round-trip.js > round-trip-output.json
          cat round-trip-output.json
      - name: Probe DSH tool-boundary enforcement
        run: |
          node boundary-probe.js > boundary-probe-output.json
          cat boundary-probe-output.json
      - name: Run seven-profile DSH differential matrix
        run: |
          node matrix.js > matrix-output.json
          cat matrix-output.json
      - name: Capture frozen dependency evidence
        run: |
          mkdir -p artifacts
          npm ls @deepseek-ai/cordis @deepseek-ai/dsh-agent-spine-demo @deepseek-ai/dsh-llm @deepseek-ai/dsh-tools @deepseek-ai/dsh-user-approval --json > artifacts/npm-tree.json
          cp package-lock.json artifacts/package-lock.json
          cp probe-output.json artifacts/probe-output.json
          cp round-trip-output.json artifacts/round-trip-output.json
          cp boundary-probe-output.json artifacts/boundary-probe-output.json
          cp matrix-output.json artifacts/matrix-output.json
      - name: Upload DeepSeek Harness probe evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: actionseam-deepseek-harness-public-probe
          path: adapters/deepseek-harness/artifacts/
          if-no-files-found: error

  deepseek-harness-acp-transport-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    defaults:
      run:
        working-directory: adapters/deepseek-harness/acp-transport
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
      - name: Install frozen ACP transport dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify transport harness failure paths
        run: npm run test:harness-safety
      - name: Preserve promoted ACP stdio baseline
        run: |
          node differential.js > transport-output.json
          cat transport-output.json
      - name: Preserve promoted ACP one-shot permission differential
        run: |
          node permission-differential.js > permission-output.json
          cat permission-output.json
      - name: Probe direct vs ACP session/cancel before tool dispatch
        run: |
          node cancel-differential.js > cancel-output.json
          cat cancel-output.json
      - name: Capture frozen ACP transport evidence
        run: |
          mkdir -p artifacts
          npm ls @agentclientprotocol/sdk @deepseek-ai/cordis @deepseek-ai/dsh-acp @deepseek-ai/dsh-agent-spine-demo @deepseek-ai/dsh-llm @deepseek-ai/dsh-tools @deepseek-ai/dsh-user-approval --json > artifacts/npm-tree.json
          cp package-lock.json artifacts/package-lock.json
          cp transport-output.json artifacts/transport-output.json
          cp permission-output.json artifacts/permission-output.json
          cp cancel-output.json artifacts/cancel-output.json
      - name: Upload DeepSeek Harness ACP transport evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: actionseam-deepseek-harness-acp-transport-probe
          path: adapters/deepseek-harness/acp-transport/artifacts/
          if-no-files-found: error
