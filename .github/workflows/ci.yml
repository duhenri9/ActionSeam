name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  reference-conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Tests
        run: node --test
      - name: Repository validation
        run: node scripts/validate-repository.js
      - name: Reference evidence
        run: node src/cli.js demo --subject reference --out artifacts/reference
      - name: Known-bad counterexamples
        run: node src/cli.js demo --subject known-bad --out artifacts/known-bad
      - name: Upload conformance evidence
        uses: actions/upload-artifact@v4
        with:
          name: actionseam-reference-evidence
          path: artifacts/
          if-no-files-found: error

  invokta-action-target:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: adapters/invokta
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install exact adapter dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify real Invokta boundary
        run: npm test
      - name: Generate Invokta matrix evidence
        run: npm run evidence
      - name: Upload Invokta evidence
        uses: actions/upload-artifact@v4
        with:
          name: actionseam-invokta-evidence
          path: adapters/invokta/artifacts/
          if-no-files-found: error

  deepseek-harness-public-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: adapters/deepseek-harness
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install frozen DSH profile dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify public bootstrap surfaces
        run: npm run verify
      - name: Emit public bootstrap probe
        run: |
          node probe.js > probe-output.json
          cat probe-output.json
      - name: Exercise real DSH AgentLoop tool round trip
        run: |
          node round-trip.js > round-trip-output.json
          cat round-trip-output.json
      - name: Probe DSH tool-boundary enforcement
        run: |
          node boundary-probe.js > boundary-probe-output.json
          cat boundary-probe-output.json
      - name: Run seven-profile DSH differential matrix
        run: |
          node matrix.js > matrix-output.json
          cat matrix-output.json
      - name: Capture frozen dependency evidence
        run: |
          mkdir -p artifacts
          npm ls @deepseek-ai/cordis @deepseek-ai/dsh-agent-spine-demo @deepseek-ai/dsh-llm @deepseek-ai/dsh-tools @deepseek-ai/dsh-user-approval --json > artifacts/npm-tree.json
          cp package-lock.json artifacts/package-lock.json
          cp probe-output.json artifacts/probe-output.json
          cp round-trip-output.json artifacts/round-trip-output.json
          cp boundary-probe-output.json artifacts/boundary-probe-output.json
          cp matrix-output.json artifacts/matrix-output.json
      - name: Upload DeepSeek Harness probe evidence
        uses: actions/upload-artifact@v4
        with:
          name: actionseam-deepseek-harness-public-probe
          path: adapters/deepseek-harness/artifacts/
          if-no-files-found: error

  deepseek-harness-acp-transport-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: adapters/deepseek-harness/acp-transport
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve exact ACP transport dependencies for lock creation
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Run direct vs real ACP stdio differential
        run: |
          node differential.js > transport-output.json
          cat transport-output.json
      - name: Capture ACP transport dependency and evidence artifacts
        run: |
          mkdir -p artifacts
          npm ls @agentclientprotocol/sdk @deepseek-ai/cordis @deepseek-ai/dsh-acp @deepseek-ai/dsh-agent-spine-demo @deepseek-ai/dsh-llm @deepseek-ai/dsh-tools --json > artifacts/npm-tree.json
          cp package-lock.json artifacts/package-lock.json
          cp transport-output.json artifacts/transport-output.json
      - name: Upload DeepSeek Harness ACP transport probe evidence
        uses: actions/upload-artifact@v4
        with:
          name: actionseam-deepseek-harness-acp-transport-probe
          path: adapters/deepseek-harness/acp-transport/artifacts/
          if-no-files-found: error
