name: Bug report
description: Reproducible ActionSeam behavior that appears incorrect
title: "bug: "
body:
  - type: input
    id: commit
    attributes:
      label: ActionSeam commit/version
    validations:
      required: true
  - type: input
    id: profile
    attributes:
      label: Profile id
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction command / steps
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed result
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
